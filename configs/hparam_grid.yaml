method: contrastive_vae
search_mode: capped_sampled_grid
max_trials: 40
search:
  latent_dim: [256, 512, 1024]
  depth: [4, 5, 6]
  width_decay: [0.95, 0.90, 0.85]
  beta_kl: [0.01, 0.05, 0.10]
  lambda_contrastive: [0.0, 0.25, 0.50, 1.00]
  contrastive_temperature: [0.05, 0.10, 0.20]
  dropout: [0.0, 0.05, 0.10]
  lr: [0.001, 0.0005]
  batch_size: [1024, 2048]
