run_name: full_wctr
input_csv: 05_transformed_survey.csv
sample_n: population_from_weight_sum
seed: 20260611
methods:
  - weighted_bootstrap
  - noncontrastive_vae
  - contrastive_vae
  - gibbs
  - bayesian_network

vae:
  epochs: 300
  batch_size: 2048
  latent_dim: 256
  depth: 5
  width_decay: 0.90
  lambda_contrastive: 0.50
  beta_kl: 0.05
  lr: 0.0005
  dropout: 0.05
  activation: relu
  normalization: layernorm
  contrastive_temperature: 0.10
  positive_aug: light
  negative_mode: marginal
  checkpoint_every: 10
  early_stopping_patience: 30
  sample_temperature: 0.8
  max_single_file_rows: 1000000
  weighting:
    use_weight_for_training_loss: true
    transform: capped_normalized
    cap_quantile: 0.99
    normalize_mean_to_one: true

gibbs:
  sweeps: 8

bayesian_network:
  max_bins: 16
  smoothing: 1.0

validation:
  run_marginals: true
  run_cross_marginals: true
  run_privacy: true
  run_aadt: true

data:
  auto_download_external: true

geo:
  tract_files:
    - data/external/tiger_tracts/md/tl_2020_24_tract.shp
    - data/external/tiger_tracts/dc/tl_2020_11_tract.shp
  aadt_points_file: data/external/mdot_aadt/aadt_points.geojson
  aadt_segments_file: data/external/mdot_aadt/aadt_segments.geojson
  crs_projected: EPSG:26985

aadt_validation:
  path_method: centroid_line
  max_od_pairs: 250000
